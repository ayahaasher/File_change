<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Modifier Pro - Web Engine</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="nav-item active" data-tab="dashboard" title="Dashboard">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">Dashboard</span>
        </div>
        <div class="nav-item" data-tab="history" title="History">
            <span class="nav-icon">📜</span>
            <span class="nav-text">History</span>
        </div>
        <div class="nav-item" data-tab="settings" title="Settings">
            <span class="nav-icon">⚙️</span>
            <span class="nav-text">Settings</span>
        </div>
    </aside>

    <main class="main-container">
        <section id="tab-dashboard" class="tab-content active">
            <section class="content-left">
                <h1>File Modifier <span class="badge">PRO v2.8</span></h1>

                <div class="glass-card">
                    <div class="card-title">📂 目标路径 (Target Path)</div>
                    <div class="current-path-bar" id="selected-path-display">未选择任何路径</div>
                    <div class="picker-actions">
                        <button class="btn-picker" id="btn-pick-folder">📁 选择文件夹</button>
                        <button class="btn-picker" id="btn-pick-file">📄 选择文件</button>
                    </div>
                </div>

                <div class="glass-card">
                    <div class="card-title" style="justify-content: space-between;">
                        <span>🔍 重命名配置</span>
                        <input type="checkbox" id="mod-name-check" checked>
                    </div>
                    <div class="input-grid">
                        <div class="input-group">
                            <label>正则模式</label>
                            <input type="text" id="rename-pattern" placeholder="例如: ^\d{5}--">
                        </div>
                        <div class="input-group">
                            <label>替换文本</label>
                            <input type="text" id="rename-replace" placeholder="留空则执行删除">
                        </div>
                    </div>
                    <div class="input-group" style="margin-top: 15px;">
                        <label>追加文件后缀</label>
                        <input type="text" id="append-suffix" placeholder="例如: misc，结果为 123.txt.misc">
                    </div>
                </div>

                <div class="glass-card">
                    <div class="card-title">📅 时间随机化 (可选开关)</div>
                    <div class="time-switches">
                        <div class="time-opt">
                            <input type="checkbox" id="mod-mtime-check" checked> <label for="mod-mtime-check">修改日期 (mtime)</label>
                        </div>
                        <div class="time-opt">
                            <input type="checkbox" id="mod-atime-check"> <label for="mod-atime-check">访问日期 (atime)</label>
                        </div>
                        <div class="time-opt">
                            <input type="checkbox" id="mod-ctime-check"> <label for="mod-ctime-check">创建日期 (ctime)</label>
                        </div>
                    </div>
                    <div class="input-grid" style="margin-top: 15px;">
                        <div class="input-group">
                            <label>随机区间：起始日期</label>
                            <input type="text" id="mtime-start" value="2025-01-01">
                        </div>
                        <div class="input-group">
                            <label>随机区间：结束日期</label>
                            <input type="text" id="mtime-end" value="2025-12-31">
                        </div>
                    </div>
                </div>

                <div class="glass-card">
                    <div class="card-title">🎯 过滤与模式</div>
                    <div class="filter-header">
                        <div class="toggle-group">
                            <button class="toggle-btn active" data-mode="include">包含后缀</button>
                            <button class="toggle-btn" data-mode="exclude">排除后缀</button>
                        </div>
                        <input type="text" id="suffix-list" placeholder="例如: doc, docx, pdf" style="margin-top: 10px;">
                    </div>

                    <div class="checkbox-group" style="margin-top: 15px;">
                        <div>
                            <input type="checkbox" id="recursive-check" checked>
                            <label for="recursive-check">递归处理</label>
                        </div>
                        <div>
                            <input type="checkbox" id="dry-run-check" checked>
                            <label for="dry-run-check">预览模式 (Dry Run)</label>
                        </div>
                    </div>
                </div>

                <button class="btn-primary" id="btn-start">启动批处理任务 🚀</button>
            </section>

            <aside class="side-panel">
                <div class="glass-card monitor-card">
                    <div class="card-title" style="justify-content: center;">实时处理状态</div>
                    <div class="progress-wrapper">
                        <div class="progress-circle" id="progress-val">0%</div>
                    </div>

                    <div class="stat-grid">
                        <div class="stat-item">
                            <div class="stat-label">📄 已重命名</div>
                            <div class="stat-value" id="stat-renamed">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">📅 时间修改</div>
                            <div class="stat-value" id="stat-ts">0</div>
                        </div>
                        <div class="stat-item" style="grid-column: span 2;">
                            <div class="stat-label">✅ 处理总进度</div>
                            <div class="stat-value" id="stat-total">0 / 0</div>
                        </div>
                    </div>

                    <div class="monitor-footer" id="status-summary">等待指令中...</div>
                </div>

                <div class="tip-card glass-card">
                    <div class="card-title">💡 温馨提示</div>
                    <p style="font-size: 0.8rem; color: var(--text-dim);">详细执行日志已整合至“历史记录”中。您可以点击历史任务的详情按钮进行追溯和审计。</p>
                </div>
            </aside>
        </section>

        <section id="tab-history" class="tab-content">
            <h1>任务历史记录</h1>
            <div class="glass-card" style="margin-top: 20px;">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>执行时间</th>
                            <th>目标路径</th>
                            <th>模式</th>
                            <th>统计(名/时/总)</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="history-list"></tbody>
                </table>
            </div>
        </section>

        <section id="tab-settings" class="tab-content">
            <h1>全局系统设置</h1>
            <div class="glass-card" style="margin-top: 20px; max-width: 600px;">
                <div class="input-group">
                    <label>默认后缀预设 (逗号分隔)</label>
                    <input type="text" id="set-default-suffixes">
                </div>
                <div class="input-group" style="margin-top: 20px;">
                    <label>启动默认行为</label>
                    <div class="settings-options">
                        <label class="settings-option" for="set-recursive-default">
                            <span>默认递归处理</span>
                            <input type="checkbox" id="set-recursive-default">
                        </label>
                        <label class="settings-option" for="set-dryrun-default">
                            <span>默认开启预览(Dry Run)</span>
                            <input type="checkbox" id="set-dryrun-default">
                        </label>
                        <label class="settings-option" for="set-ignore-hidden">
                            <span>忽略隐藏文件</span>
                            <input type="checkbox" id="set-ignore-hidden">
                        </label>
                    </div>
                </div>
                <button class="btn-primary" id="btn-save-settings" style="margin-top: 30px;">应用全局配置 💾</button>
            </div>
        </section>
    </main>

    <div id="log-modal" class="modal-overlay">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h2>任务执行详情日志</h2>
                <button id="close-modal" class="btn-mini">关闭 ×</button>
            </div>
            <div class="modal-body" id="modal-log-content"></div>
        </div>
    </div>

    <script src="/static/main.js"></script>
</body>
</html>
